    <div class="background-container"></div>
    <audio id="backgroundMusic" loop src="22.mp3"></audio>

    <div class="step active" id="step1">
        <div class="gift-container" id="giftContainer">
            <div class="gift-box">
                <div class="gift-lid"></div>
                <div class="gift-bow"></div>
            </div>
            <p class="instruction-text">A surprise is waiting...</p>
        </div>
    </div>

    <div class="step" id="step2">
        <div class="key-container" id="keyContainer">
            <svg id="animatedKey" class="key-svg" viewBox="0 0 120 200">
                <!-- Key head (circular bow) -->
                <circle cx="60" cy="40" r="28" stroke-width="6" fill="none"/>
                <circle cx="60" cy="40" r="16" stroke-width="4" fill="none"/>
                <!-- Key shaft -->
                <line x1="60" y1="68" x2="60" y2="170" stroke-width="6" stroke-linecap="round"/>
                <!-- Key teeth -->
                <line x1="60" y1="140" x2="78" y2="140" stroke-width="5" stroke-linecap="round"/>
                <line x1="60" y1="155" x2="72" y2="155" stroke-width="5" stroke-linecap="round"/>
                <line x1="60" y1="170" x2="78" y2="170" stroke-width="5" stroke-linecap="round"/>
            </svg>
            <p class="instruction-text">A key to unlock the magic...</p>
        </div>
    </div>

    <div class="step" id="step3">
        <div class="storybook-container" id="storybookContainer">
            <div class="book">
                <div class="book-cover" id="bookCover">
                    <div class="cover-front">
                        <h2 class="book-title">Chapter 22</h2>
                    </div>
                    <div class="cover-back"></div>
                </div>
                <div class="page" id="page1">
                    <div class="page-front">
                        <p class="page-text">I don't know about you...</p>
                    </div>
                    <div class="page-back">
                        <p class="page-text">But I'm feeling 22 ✨</p>
                    </div>
                </div>
                <div class="page" id="page2">
                    <div class="page-front">
                        <p class="page-text">Everything will be alright if you keep me next to you...</p>
                    </div>
                    <div class="page-back">
                        <p class="page-text">Happy 22. 🎂</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
